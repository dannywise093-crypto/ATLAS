name: ATLAS TTS preview smoke

on:
  push:
    branches:
      - feature/atlas-interruptible-voice
    paths:
      - 'functions/api/tts-smoke-9x7k2m4q8p.js'

jobs:
  speech-smoke:
    if: ${{ github.event.head_commit.message != 'Remove one-time ATLAS TTS preview smoke test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Cloudflare Pages preview deployment
        run: sleep 75
      - name: Verify Pages Function to Cloudflare Workers AI audio path
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors 'https://feature-atlas-interruptible.atlas-coding-chat.pages.dev/api/tts-smoke-9x7k2m4q8p')"
          echo "$response"
          echo "$response" | jq -e '.ok == true and .bytes > 100 and .contentType == "audio/mpeg"'
