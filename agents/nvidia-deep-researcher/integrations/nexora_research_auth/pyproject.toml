[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-research-auth"
version = "0.1.0"
description = "NEXORA server-to-server authentication adapter for NVIDIA Deep Researcher"
requires-python = ">=3.11"

[project.entry-points."deep_researcher_api.validators"]
nexora_service_token = "nexora_research_auth:get_validators"

[tool.setuptools]
packages = ["nexora_research_auth"]
